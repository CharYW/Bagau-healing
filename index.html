，主疏泄，司氣機，喜條達。\n• 4為震，為雷，形象下雷震雨，可解口乾。\n• 4為震，為雷，為聲，以復聽力。\n• 4主小腹（肝經抵小腹）。\n• 4治乳患（肝經抵乳頭）。"],[18,"巽卦（5）總說明","5",1,"巽卦（5）單元方","• 5為巽卦，為膽，為呼吸器官（肺，氣管，鼻）為胸部，為食道，腸道，血管，神經，筋，林巴，為左肩背，左手，股（下腹部，下肢，大腿），為頭髮，眼。\n• 5為風，為進退，為散，有溫陽疏風功能。\n• 5溫陽，化氣，通絡，助腎陽，降濁氣。\n• 5為巽木，主膽，主氣，助腎氣·化氣通滯。\n• 溫心陽，逐脾濕，驅陰寒。\n• 5奇數為陽，為風，善通周身。\n• 5可提氣溫通之力強。\n• 5多用于氣虧陽虛者。\n• 5為陽氣。\n• 5為風，為陽，兼驅風散寒。\n• 益氣，助陽，疏解肝鬱。\n• 5膽為陽木，其體陽而用陰（膽分泌膽汁為陰）故又振陽，又疏泄。\n• 5為膽，為胸，為肺，為氣管，為鼻，可呼吸，發散，治胸疾，膽疾；治呼吸系統疾病。\n• 5為陽數，化氣，主目（肝開竅于目），主鼻，主肺（巽為風，為出入，為喘息象）。\n• 5為膽，可和胃，降逆，泄火。\n• 鼻病可用5（後天八卦圖5在中間）。\n• 5木克艮土可排石，散結，消瘤。\n• 散結通便（5為風，風以散之）。\n• 5為木，具有生長條達，能屈能伸的特性，配合治肩周炎（5為左肩）。\n• 5巽為直，為長，治強直強硬性疾病。\n• 5為股，為直，為長，治股痛（小腹，大腿，下肢）。\n• 5為股，為四肢，為神經，巽木可生離火，祛風除邪，治坐骨神經痛。\n• 5膽，主肺，主宣發，益皮氣，·5為風，有止癢功能。\n• 5善肋陽，益氣通絡，但其氣易上揚，須慎用。\n• 5偏陽，有損陰之趨，陰虛者不宜用。"],[18,"坎卦（6）總說明","6",1,"坎卦（6）單元方","• 6為坎卦，主腎，主膀胱，主水，主泌尿系統，生殖系統，為血液，體液，主血液水分體液循環，為骨，骨膜，背脊骨，腰，為心，耳，發。\n• 6為低下，為下頜，為肛門。\n• 腎藏精，主發育，生長。\n• 6主骨，生髓，益髓海，健腦。\n• 6為坎，為水，為通，為利，利諸經（腎為陰陽之根），通心腎。\n• 6主元氣，通腎固元，通腎氣，利血脈。\n• 6為血液，為脂，可降低血液粘稠度，降血脂。\n• 6為氣之根，可納氣。\n• 6為陰，陰氣最重，為陽氣將復生，但6比1溫。\n• 6為險，為陷，為潰瘍。\n• 6為毒，有清熱解毒之功。\n• 6為足太陽膀胱經。“太陽為開，主一身之表”。故膀胱經有解表功能，可疏泄膀胱經，解一身表症之外感。\n• 6坎為腰，為腎，為小腹。\n• 6為腎水，為經血水，生殖器官司屬腎。"],[18,"艮卦（7）總說明","7",1,"艮卦（7）單元方","• 7為艮卦，為胃，主胃之升提，主肅降，調胃氣。\n• 7陽土，為中氣，振後天之氣。\n• 7為山，為凸，為頭，鼻，牙，顴，肩，背，腰，臂，手，手背，手指，骨，骨節，關節，諸節，左足，足背，足趾，乳房，男生殖器。\n• 7為山，為止，為堵，為障，為陰，為滯，為梗，通滯止痛。\n• 7有提氣，壯骨，振陽，溫通局部，疏通脈絡，除寒濕，消腫，利關節，調胃氣，通利手足等之力，中氣不足，氣短乏力，需補後天之氣，多用7。\n• 7性不涼不熱，偏去熱。\n• 7為石，為凸，治凸起的瘤，皰，炎，疹，癬，痔瘡。\n• 7為頑，為固，治疑難病症。"],[18,"坤卦（8）總說明","8",1,"坤卦（8）單元方","• 8為坤卦，主脾胃，主口唇，主运化，主肌肉，主四肢，主統血。\n• 8為為任脈，為腹，為右肩，為胰腺。\n• 8為陰，為潰，為終，為舊，為濁物，為瘡。\n• 8為脾，攝血，消腫，去毒，溫脾，祛濕，緩急，散腹中之寒。\n• 8溫中施布。\n• 8坤土有載物生化的特性，坤土喜離火，脾喜燥惡濕。\n• 坤有祛腫滿及軟化作用。\n• 脾虛或因寒腹痛，甚或泄瀉或肌肉疼痛，或風濕，或胃寒，多用8。"],[18,"乾卦（1）配方詳解","10",1,"乾卦（1）單元方","• 疏通督脈（偏助陽）。通周身陽經。提高兒童智力（1為乾，為首，主宰）。\n• 調脊柱（通督）及周身（乾為周身），利右腿。\n• 治便秘（1主大腸，性偏涼，另：2與大腸互為表裡，2多用于氣虧氣滯引起的大腸之患）。"],[18,"乾卦（1）配方詳解","100",1,"乾卦（1）單元方","• 通督，偏肋陰，適合熱症，如用以治寒痺易出現不適。"],[18,"乾卦（1）配方詳解","1000",1,"乾卦（1）單元方","• 通督，導經絡，三個0強化通督力量。\n• 振陽氣，祛寒濕，又益腎行氣活血。\n• 溫振督脈，治腰腿骨質增生。"],[18,"乾卦（1）配方詳解","010",1,"乾卦（1）單元方","• 通督脈，調諸經（1為諸陽之本）。\n• 治血虧引起的頭疾。治右腿足之患（通督，溫諸陽，又1為右足，乾為陽之本）。\n• 止血，止痛（1通督，前後0稍偏陽，可加速血脈周流和經脈傳導止血，止痛）。"],[18,"乾卦（1）配方詳解","0100",1,"乾卦（1）單元方","• 治頭疾（偏陽者）。"],[18,"乾卦（1）配方詳解","01000",1,"乾卦（1）單元方","• 治坐骨神經痛（右側）兼高血壓。"],[18,"乾卦（1）配方詳解","00100",1,"乾卦（1）單元方","• 1為乾，為督脈，為陽，前後加00偏陰，不致于陽過（緩其1溫陽之俊）。\n• 治頭疾（偏陽者）。\n• 潤腸通大便，治痔瘡（通經活絡，消散肛門灼熱和瘀血。）"],[18,"乾卦（1）配方詳解","0001000",1,"乾卦（1）單元方","• 1通督，疏導諸經，前後000偏于溫通，其力較宏。\n• 治右側坐骨神經痛，脊骨砸傷，右腿腫痛，右腳趾痛等。"],[18,"乾卦（1）配方詳解","01",1,"乾卦（1）單元方","• 清肺（肺與大腸互為表裡），前0以增強滋陰功能（如治肺熱或便秘方01·6000）。\n• 性寒（乾為寒）涼頭（乾為首，為頭）降熱（如治高燒方06·04·07·01）"],[18,"乾卦（1）配方詳解","001",1,"乾卦（1）單元方","• 止頭燒。"],[18,"乾卦（1）配方詳解","11160",1,"乾卦（1）單元方","• 補腦（乾金生坎水，腎藏精，精生髓，腦為髓之海）。"],[18,"乾卦（1）配方詳解","1260",1,"乾卦（1）單元方","• 振腎氣（1乾為諸陽之本，又偏涼清胃火2主氣，雙金生坎水6腎）。"],[18,"乾卦（1）配方詳解","160",1,"乾卦（1）單元方","• 滋陰潛陽，滋陰降火，清熱，降濁，開胸順氣，潤肺，通絡，通利諸經，振奮腎氣，益腎壯骨（1主骨）利腰椎。治寒邪所致胸椎痛（振督，溫腎陽）。\n• 利水解毒，消腫通絡，治手腕，腳踝腫痛。\n• 降頭中濁氣（1乾為首）佐以明目，通督脈，以振乾陽明目，又益腎補氣攝血，平腹痛（6為下腹），治血虧引起的頭疾，排首之毒（1為首，6為首，坎為陷為毒），清毒（如治傷排膿方2000·160·050）。\n• 清熱解毒，清耳道，助聽力（1寒涼，清邪熱，乾為正，促復正，腎開竅于耳）。\n• 瀉大腸之實，之熱邪，防大腸乾結，治便秘（滋腎水以降火通便），又補大腸。"],[18,"乾卦（1）配方詳解","1600",1,"乾卦（1）單元方","• 滋腎陰，疏導頭部氣機（1為乾，為頭。為血管）"],[18,"乾卦（1）配方詳解","16000",1,"乾卦（1）單元方","• 1為乾金，為大腸，金生坎水，000強化溫通之力，用以主元治大腸癌。振督益腎氣，利水解毒，消腫通絡，治手腕，腳踝腫痛，肋被擊傷痛（1為骨，6為腎水，子泄母瘀，且補腎）。\n• 出汗排毒。"],[18,"乾卦（1）配方詳解","1640",1,"乾卦（1）單元方","• 以相生之力交通心腎，調氣機，治頭疾（偏陽者），清胃火（1偏涼），利小腹。"],[18,"乾卦（1）配方詳解","16450",1,"乾卦（1）單元方","• 治皮膚病（偏陰者），老年皮膚瘙癢症，還可用于肌膚除濕等。"],[18,"乾卦（1）配方詳解","1650",1,"乾卦（1）單元方","• 通督溫陽，以驅周身寒濕，治頭疾（血虧引起者）。"],[18,"兌卦（2）配方詳解","20",1,"兌卦（2）單元方","• 宣肺理氣，表邪，肅降，布散，降濁布氣。行氣，通經絡。\n• 疏導全身之氣機，氣行血行，振氣活血散結，治氣血不足。\n• 疏導氣機，止痛（通則不痛），消炎，治右肘痛（2為右臂）。\n• 主治肺疾，其力較宏，宣肺止咳，宣散肺中瘀滯及局部寒邪，治外感咳嗽。\n• 清利咽喉，化痰（脾為生痰之源，肺為儲痰之器，2為脾之子，20泄脾痰，又清肺化痰）。\n• 通調氣機，以利諸經，宣肺滌痰。\n• 疏泄胃經之邪（子泄母瘀）。肋腎氣（金生水），有補腎作用。\n• 振脾益氣（2主全身之氣含脾氣），利脾腎氣化，配其它方促病愈。\n• 解表，宣肺散熱（2為偶數偏陰，主皮毛），治暑熱（理氣，打開毛孔散暑熱）。小兒發燒頭痛。\n• 治氣虧氣滯引起的大腸之患。\n• 通條水道，利尿（肺主肅降），理氣滲濕（排邪于下），配合治寒濕腰痛。\n• 肺開竅于鼻，治鼻病，側重于肺虛者（另7治鼻病偏于胃氣不足者）。\n• 治口腔潰爛（兌為口，偏于氣虧者多用20）。\n• 治莫明其妙的哭（2主悲）。"],[18,"兌卦（2）配方詳解","200",1,"兌卦（2）單元方","• 肺主氣，00可使氣平緩运行。\n• 金生水，振母之氣腎陽00防其傷陰，配合治腰痛。\n• 宣肺，理氣，助氣，化濁，止咳。\n• 治口腔潰瘍（2為兌上缺，陰虛者）。"],[18,"兌卦（2）配方詳解","2000",1,"兌卦（2）單元方","• 振全身氣機，振肺氣，促肅降，宣發。\n• 通便（2主肅降，肺與大腸互為表裡）。\n• 理氣，活血，化瘀，通絡，止痛力大，治突發性嚴重頭痛（2為通，疏導氣機，“通則不痛”）。\n• 肺主氣，給呼吸困難，胸悶者增氧，補氣。理氣，通血脈，以利心臟；• 治肺虛所致風寒感冒，易汗（如治感冒咳嗽方2000·60）。\n• 通條水道，又利氣機以散瘀。\n• 降濁通絡，通條水道（000強化功能）。\n• 通條水道力宏（肅降上焦之水濕下排以助腎），利尿，促排石等。\n• 滋陰解瘀，通絡祛邪（治肩周炎）。\n• 通足跟，利關節（2兌金為骨）。\n• 治外感風寒引起的肩周炎（右肩更效），治右肘痛，手腕錯位等（兌為右臂）。\n• 肺主皮毛，宣散外邪，肋衛外功能，疏解表邪，祛風除濕，治皮膚病（皮膚腠理不固）。如風熱風疹，皮膚過敏。火癤，泄毒邪力宏（疏通局部經脈，驅邪外出，又脾為肌肉，2脾土之子）。\n• 治刀傷（2為兌，為缺口，偏于右手），促傷口愈合。\n• 治帶下（濕熱）。\n• 治耳聾（振腎陽）。耳膜穿孔（兌為缺，為耳道。2主氣，解毒，又為皮毛，可促破損愈合。000強化，偏熱，耳膜與2000諧振發熱）。\n• 治口瘡（兌為缺，為口，適于脾虛濕困，體弱者）。"],[18,"兌卦（2）配方詳解","020",1,"兌卦（2）單元方","• 20消炎止痛，前加0防助陽太過，如治腮腺炎方050·020·60。2.5前後加深行氣清熱。\n• 治青春痘（肺主皮毛，020清熱消炎）。\n• 治咽喉痛，突發性牙痛，尿道口奇癢，痔瘡等（2為缺口，用于偏陰虛體）。"],[18,"兌卦（2）配方詳解","00020",1,"兌卦（2）單元方","• 治老年皮膚瘙癢。"],[18,"兌卦（2）配方詳解","00200",1,"兌卦（2）單元方","• 治魚刺卡喉方00200·00600（2為喉，又為金似白色鑷子把骨夾出來，6來骨，為水衝），• 前後加深00為陰陽之氣共振，偏補陰為主，治肺陰虛所致鼻乾燥，口瘡，咽乾咳嗽。\n• 降火通便，退燒（兌肛門，肺主肅降，通條水道，刮二便，肺與大腸互表裡，前後00均為陰）。\n• 治肛裂，痔瘡，止血止痛。"],[18,"兌卦（2）配方詳解","0002000",1,"兌卦（2）單元方","• 前後均000為陽中生陰，屬陰陽之氣共振，偏補陽，治肺虛所致咽乾咳嗽。\n• 溫通一身氣機，活血，止痛，散瘀（血過寒則凝）。\n• 治泌尿系感染（濕熱淋）。"],[18,"兌卦（2）配方詳解","02",1,"兌卦（2）單元方","• 兌澤，02偏涼，息火，治各種炎症（如口腔炎）。熱症（ 如治高燒方06·04·08·02）。\n• 養陰祛風，治皮膚病（偏陽體）。"],[18,"兌卦（2）配方詳解","002",1,"兌卦（2）單元方","• 滋陰降火（00偏陰），治肺陰虛所致咽乾咳嗽，燥熱咳。\n• 治蕁麻疹（2解表邪），帶狀皰疹（去火降溫），肛門奇癢等。"],[18,"兌卦（2）配方詳解","0002",1,"兌卦（2）單元方","• 養陰驅風，清熱解表，除邪止癢，000強化疏風利濕，000在2前，可助清熱，防疏風解表力強而傷陰，若用00偶數不易除濕邪。\n• 可潤澤皮膚，治皮膚病（偏陽體）。如皮疹，皮膚瘙癢，蕁麻疹，癤子，雙腳潰爛，老爛腳等。\n• 运化濕熱，治口腔病等；滲濕利水，通條水道，治尿道病等，前沿000以利氣化。"],[18,"兌卦（2）配方詳解","260",1,"兌卦（2）單元方","• 補心氣，治心臟病及心臟病急發作。\n• 治高血壓，動脈硬化。\n• 治氣虛陰虧所致低血壓及血壓偏低頭暈。\n• 通肺氣（2為肺，6為通）。\n• 補腎氣，宣肺，止咳。\n• 祛痰（2主氣管，痰，子泄母）。\n• 補腎納氣（腎主納氣）。化痰平喘，治肺實（用于濕邪盛）。痞悶。\n• 益腎，宣肺，化痰。\n• 補元氣。\n• 增強體力，扶正固本通絡。\n• 補腎精。\n• 溫腎通陽。\n• 偏于助腎陽，但為陰數（偶數），也有護陰作用。\n• 補腎益氣，偏補腎氣，培本固元，先天得補，濟養後天，同時益肺，益肝，平肝火（肝腎同源），可緩解陰虛陽亢之象。\n• 和氣血，通絡生津。\n• 益氣養血。\n• 滋陰養血。\n• 補腎壯骨。\n• 可疏脊椎諸關節（頸胸腰椎，6腎，膀胱經夾脊下行）。\n• 治腎虛所致耳聾，耳鳴，聽力減退，頭暈眼花，老年花眼，腰痛，腰背酸痛，神倦，老打哈欠，口乾（唾為腎之液），口咽痛，便秘，尿不暢，前列腺病（腎開竅于耳和二陰），不孕症。\n• 振奮腎氣，調水道。\n• 去斑疹等（2為皮膚，6子泄母）。\n• 溫通腎陽，可直達胞宮。止血提氣，治經血過多（2為氣，又母生子助腎，腎主水主血）。"],[18,"兌卦（2）配方詳解","2600",1,"兌卦（2）單元方","• 助腎氣（00防傷陰）。\n• 治肺實（子泄母）。\n• 滋腎陰，治腎陰虛脫髮。"],[18,"兌卦（2）配方詳解","26000",1,"兌卦（2）單元方","• 助腎氣，溫通局部。\n• 補腎利水，消水腫。\n• 補氣活血通利（2主氣，6主血，通經）。"],[18,"兌卦（2）配方詳解","0260",1,"兌卦（2）單元方","• 通腎氣活血，疏通腰絡（治腰扭傷）。\n• 治肺實（子母泄）。\n• 滋腎陰，治腎陰虛脫髮。"],[18,"兌卦（2）配方詳解","2640",1,"兌卦（2）單元方","• 助腎氣，壯骨（腎主骨，生髓）。化氣通絡。"],[18,"兌卦（2）配方詳解","26400",1,"兌卦（2）單元方","• 通肺腎，補肝，利筋（肝主筋）。"],[18,"兌卦（2）配方詳解","2650",1,"兌卦（2）單元方","• 溫振腎陽（補腎溫陽，強腎之本振陽氣），治腎陽虛症。\n• 宣肺氣，充盈腎氣，壯陽溫大腸，祛 濕寒，治腹瀉等。\n• 2主氣，6腎生髓，主骨，祛陰邪，壯骨，治頸椎病等。"],[18,"兌卦（2）配方詳解","265000",1,"兌卦（2）單元方","• 助腎氣，溫腎，驅寒。"],[18,"兌卦（2）配方詳解","2660",1,"兌卦（2）單元方","• ●26660·補腎，治腰痛。"],[18,"離卦（3）配方詳解","30",1,"離卦（3）單元方","• 強心，通心氣，益心陽，振奮心肌，治心臟疾患，除煩安神。\n• 溫通心陽，促氣血暢達（3為火，主血脈，通三焦，促血液循環），治血管硬化，貧血等。\n• 益心養目，除眼乾澀，治近視眼。\n• 益脾陽（火生土，溫脾除濕，有溫煦之效）。\n• 補脾陰，緩助脾陽所急。"],[18,"離卦（3）配方詳解","300",1,"離卦（3）單元方","• 行血養血（3為血脈，00可抑制熱性太過）。\n• 治眼乾澀。\n• 助起搏，降心火，安神，治風濕性心臟病（00增加心陽，止心悸）。\n• 泄肝心之火（肝為心之母，子泄母，00又為陰）。\n• 提高兒童智力（3為心，頭，神志）。"],[18,"離卦（3）配方詳解","3000",1,"離卦（3）單元方","• 振奮心陽，並下溫脾陽（火生土）。"],[18,"離卦（3）配方詳解","030",1,"離卦（3）單元方","• 調整心之陰陽，治心頭不適，血虧引起的頭疾。\n• 通脈，養血，安神。\n• 通血脈，助陰津，又通心氣。\n• 溫補心肌，增強心臟搏動，增氧。\n• 通心氣（前後0滋陰防陽亢）。\n• 治心火偏亢。\n• 活血，通血脈，散瘀結，化瘀滯。\n• 治肺熱（火克金）。"],[18,"離卦（3）配方詳解","00300",1,"離卦（3）單元方","• 3為離，為火，前後均加0為清火，後00為陰中有陽，防寒涼有過。\n• 滋陰，清熱，安神，散結，化氣，通絡。\n• 清熱，治頭疾（偏陽者），眼疾。"],[18,"離卦（3）配方詳解","0003000",1,"離卦（3）單元方","• 治眼不適，眼球鼓脹。"],[18,"離卦（3）配方詳解","0030",1,"離卦（3）單元方","• 治暴發火眼（目赤）。"],[18,"離卦（3）配方詳解","03",1,"離卦（3）單元方","• 治頭部疾患頭暈，頭痛，神志，增智等）偏陽者。\n• 治心火偏亢，泄心火，清小腸濕熱（3為小腸）。\n• 止切洋蔥辣眼，緩吃辣椒太辣。"],[18,"離卦（3）配方詳解","003",1,"離卦（3）單元方","• 治頭部疾患（頭暈，頭痛，神志，增智等）偏陽者。\n• 治高血脂，高血壓（心主血脈）。\n• 治陰虛症，心火偏亢，肺熱（火克金）。泄肝火（子泄母）。\n• 治火傷，燙傷。\n• 有涼血之意，血涼則凝，如003·70止血。\n• 清小腸之火（3為小腸），但利水較差。\n• 治帶狀皰疹（皰疹潮紅如火），癤子，口腔潰爛。\n• 止切洋蔥辣眼，緩吃辣椒太辣。\n• 治多種眼病，如急性結膜炎（急性結膜炎似火，00偏涼，003正合水克火之意），眼紅腫（肝火上炎），眼紅有眼屎，迎風流淚，近視眼，青光眼，眼碰傷致瞎，電焊閃眼。"],[18,"離卦（3）配方詳解","00003",1,"離卦（3）單元方","• ●0000003·治牙痛（火牙）。"],[18,"離卦（3）配方詳解","330",1,"離卦（3）單元方","• 治風濕性心臟病（心臟病都有寒氣）。\n• 治貧血。"],[18,"離卦（3）配方詳解","3330",1,"離卦（3）單元方","• 治風濕性心臟病。\n• 治陰氣寒氣重，輸入陽氣。"],[18,"離卦（3）配方詳解","370",1,"離卦（3）單元方","• 治血虧引起的頭疾（3為頭，主血脈搏，7為艮，為凸，為頭，火生土，加強頭部供血）。\n• 強心，增加心陽，疏導局部氣機，疏通經絡，含疏通心臟自導神經。\n• 治胃腸疾患，如胃寒（3偏熱，火生土，以祛寒），胃痛，結腸炎。\n• 疏肝，統血，攝血。\n• 和胃，溫關節（離火生艮土），補中益氣，祛寒濕。\n• 健中升提，祛寒濕，利關節，升清降濁。\n• 溫中散寒，和氣血，利頭節，助心脾，資腎。\n• 散寒除濕，利關節（3火通三焦，為血液循環，7為艮為凸，為頭節，故370善降陰濕之邪）。\n• 治鼻炎（7為循經取數，胃經夾鼻上行，7又為疑難病）。\n• 治咽炎。"],[18,"離卦（3）配方詳解","0370",1,"離卦（3）單元方","• 提高兒童智力（3為心，頭，神志，7為凸，神志，又火生土。"],[18,"離卦（3）配方詳解","372000",1,"離卦（3）單元方","• 溫中散寒，疏導胃氣。"],[18,"離卦（3）配方詳解","380",1,"離卦（3）單元方","• 溫補脾陽（溫通脾陽），助生化速效，有溫熱之力，但老人體弱者受不了。\n• 健脾安神（本方偏熱，可將380分為二個元: 30·80即補瀉不著，著重各自振本臟）。\n• 健脾止咳祛痰（“肺為儲痰之器，脾為生痰之源”）。\n• 溫脾，提氣，明目。\n• 溫健脾胃（火生土地，脾與胃互為表裡），補中氣，治胃痛吐酸，食欲不振，腹脹，腹瀉，胸痛。倦怠，浮腫等。\n• 治右肩背痛（8為右肩）。\n• 治肝疾（“補脾則肝自愈”）。\n• 健脾燥濕，活血消栓，增強肛門擴約肌运動及抗腐功能，治肛門疾患。\n• 健脾統血（3為血，8脾為血庫，統攝血液），治便血，崩漏，紫斑等（均為脾不統血所致）。\n• 坤土喜離火，坤有載物，生化的特性，助生物生長（8坤，性溫，污物，肥源，生物，滋生，3在上，似光照，“一生二，二生三，三生萬物“）。"],[18,"離卦（3）配方詳解","3800",1,"離卦（3）單元方","• 溫健脾胃，升清降濁，00緩其助陽之過。"],[18,"離卦（3）配方詳解","38000",1,"離卦（3）單元方","• 加強健脾氣，生化氣血。"],[18,"離卦（3）配方詳解","3820",1,"離卦（3）單元方","• 壯心陽，益心血，健脾胃，益氣活血，升清降濁（濁氣上逆，諸病皆上頭，故需升清降濁）。\n• 治頭疾。\n• 溫通心陽，健脾補中氣。\n• 以相生之力健脾，溫中，益氣，統血（3, 8, 2相生，兌金之氣反又助脾）。\n• 溫補脾陽，治胃寒胃痛（38補脾胃，2主氣，主肅降）。\n• 健脾益氣，使氣血暢活，益脾之力較著，脾氣健，运化正常促排氣，治脾胃脹滿。\n• 以相生相助溫中，化濁，驅寒，通絡（3主血脈，主熱，8溫中施布，2調氣通絡）\n• 健脾溫中，散寒助氣，益氣通脈。\n• 健脾滲濕，化氣利水。\n• 健脾統血。溫通衝任二脈（任脈為陰之本，8主腹），治婦科病。"],[18,"離卦（3）配方詳解","382000",1,"離卦（3）單元方","• 強化健脾益氣"],[18,"震卦（4）配方詳解","40",1,"震卦（4）單元方","• 肝主疏泄，疏肝，調達肝氣，疏導氣機，疏導凝滯之氣，降濁息風，並使全身陰陽平秘。\n• 疏頭部經絡（4為震，為動，為思，主頭）。\n• 疏頭部氣機（震為頭）。\n• 疏氣機以清頭。\n• 提高兒童智力（震，動，思維活動，又小兒常肝氣有餘，疏肝利增智）。\n• 肝藏血，又肝木生心火，滋心陰，益心血，治氣血不足，心腦供血不足。\n• 疏導心臟氣機，利心氣，平心氣，平心氣，振心氣。\n• 強化心臟功能而安神。\n• 通心絡，通心氣，（4為震，為動，為心），疏氣，養血，安神（震主肝血，主心臟，心主神志）。\n• 行氣血。\n• 通利血脈。\n• 清利滋陰養血。\n• 疏泄氣機，護陰。\n• 益肝疏導。\n• 養陰疏導。\n• 舒肝和胃。以疏泄土壅木鬱，而利濕，而化瘀。\n• 滌痰濁，治氣機，以利排濁。\n• 疏肝利膽（肝與膽互為表裡），治膽疾，利排石（4震木克7艮石，為擊石之象）。\n• 疏泄局部，疏筋緩急，滑潤關節，活血止痛，如治浮腫、頸部腫塊，致傷腫痛等。\n• 疏導氣機，通經絡。\n• 通絡，滲濕，利節。\n• 疏泄土瘀，利于調暢氣機，通諸絡。\n• 治筋肉拘攣，手足震顫，肢體麻木，屈伸不利，視物昏花，筋弱無力，指甲薄軟，脆裂（均為肝血不足所致）。\n• 疏泄，活血，去瘀，生新，如治痔瘡。\n• 可通氣于足（震為足）\n• 治腿足疾患（腿足為肝經經過之處）。如足扭傷腫痛。\n• 滲濕化濁。\n• 治溢淚（4疏氣，利水）。\n• 利濕以助溢淚（肝主疏泄，喜條達）。\n• 酒喝多了（震出來）。\n• 喉卡刺（震出來）。\n• 疏泄肝經瘀滯（乳頭屬足陰肝經）。利小腹（肝經抵小腹）。\n• 治月經量少，閉經（補肝血，發揮肝藏血功能）\n• 通阻滯，消解乳腺增生（40克艮土7）。\n• 治小兒疝氣（方40·70, 病在足厥陰肝經，震木克7艮土，故速效）。"],[18,"震卦（4）配方詳解","400",1,"震卦（4）單元方","• 理氣，和血，清頭。\n• 行氣，和血，柔肝，清頭降逆。\n• 振奮心肌，調整血流，平補心陽，泄瘀血。\n• 養肝血，安神。\n• 交通心腎，泄腎陽，補心陰（心腎不交為心腎陰虛），養肝滋腎（肝腎同源），治失眠。\n• 治乾咳（養肝陰潤肺，使用權其宣降正常而止咳）。\n• 治咽喉痛（肺腎虧耗所致）。\n• 疏氣滋陰。\n• 滋肝陰，助胃陰，清胃火，清血熱。\n• 和胃疏解（00滋水）。\n• 柔肝，養陰，和胃。\n• 疏肝行氣，止酸水。\n• 滋陰潛陽，疏肝利膽。\n• 偏補肝血（加00偏陰而柔肝）。\n• 治肝炎。\n• 治膽疾（肝膽互為表裡）。\n• 息肝火多用400, 而不用金克木配方。\n• 治抽搐（方650·400）。\n• 治半身不遂（4為震，為足）。\n• 利左下頜。\n• 消堅散結（4震木克7艮土，艮為硬）。\n• 清熱消腫，治踝扭傷（4為足，00偏涼）。\n• 養陰驅風，治皮膚病（偏陽者），老年皮膚瘙癢等。\n• 治指甲脆裂（此為肝血虛，本方養肝血，濡養筋脈，爪甲）。\n• 治眼乾澀（肝開竅于目），視物模糊，夜盲（為肝血不足），紅眼（為肝火上擾）。"],[18,"震卦（4）配方詳解","4000",1,"震卦（4）單元方","• 疏肝（加000以振陽氣，陽化氣）。\n• 助心陽而降濁清頭。\n• 通心陽而振心氣。\n• 理氣化痰利水。\n• 疏氣機，和胃。\n• 健胃和中。\n• 疏導土壅，損其有餘。\n• 治突發胃痛（肝主疏泄，肝氣疏則胃氣和降，胃痛自除）。\n• 行氣化瘀，疏氣利水。\n• 助腎陽，降虛火。\n• 理氣，化瘀，通絡，利足。\n• 調氣滲濕。\n• 疏氣利濕。\n• 疏肝解瘀，治手顫抖，手腕痛（左手腕痛更效），抽筋，手指抽筋（左手指抽筋更效），足行遲滯，足傷痛，踝扭傷（左足踝傷更效）（4為震，為動，為手足，為筋）。\n• 養血舒筋，以制手顫。\n• 治項強，另外車輪陷入坑內助推車，窗子打不開助開窗，瓶蓋打不開助開瓶蓋，水龍頭擰。不開助擰開（4為震，加000為強烈振動）。\n• 止癌痛，治肝癌肝硬化腹水。\n• 治左肋岔氣（4為左肋），突發肋骨痛，左肋痛（增為肝氣滯所致）。\n• 疏泄，滲利，清熱，治腳腫脹瘀多用本方（關節腫痛多用7000）。\n• 治喉卡刺（震出）。\n• 解口乾（4為震，為雷，形象下雷震雨）。\n• 止眼流淚（淚為肝之液）。\n• 善調婦科之患（肝經循經小腹）。\n• 養血，和氣血，調血量（肝藏血）。"],[18,"震卦（4）配方詳解","040",1,"震卦（4）單元方","• 疏氣化濁以清頭，·滋陰，調氣，行血，以除頭痛，頭暈。\n• 通心氣，養心血，鎮心安神。\n• 養血安神。\n• 養肝血，安心神。\n• 滋陰潛陽。\n• 滋陰降火。\n• 疏氣育陰。\n• 養血疏導。\n• 調肝和胃（偏陰）。\n• 利膽和胃，疏泄土壅。\n• 養血滋陰，利肝腎。\n• 疏利肝膽，強經排石，並護陰。\n• 通腎氣。\n• 疏氣通利。\n• 滋陰疏氣，通利小便。\n• 化瘀通絡。\n• 消堅散結，利骨節。"],[18,"震卦（4）配方詳解","00400",1,"震卦（4）單元方","• 疏肝和胃，滋陰潛陽。\n• 柔肝，活血，養陰。\n• 行氣，活血，化瘀，護陰。"],[18,"震卦（4）配方詳解","0004000",1,"震卦（4）單元方","• 肝主疏泄，此方為治癇主力，癲癇發作前兆（頭暈）用此方止發作。前後000加強利水消腫散瘀活血之力，治踝扭傷，燙傷，足腫痛，左足拇趾外傷流血。"],[18,"震卦（4）配方詳解","04",1,"震卦（4）單元方","• 4為陰數，前加0又偏涼，此方疏解氣機，解表散熱，滋肝陰。發燒多防肝風內動。\n• 如治高燒方06·04·08·02（本來5膽為巽風，為出入，最善解表，但5為陽數偏溫，肝膽互為表裡，用本方解表散熱當屬）。"],[18,"震卦（4）配方詳解","430",1,"震卦（4）單元方","• 振奮肝臟，又補（養）心血，強心，治心血不足，心慌心悸，心臟病，冠心病急發作。\n• 滋陰降火，瀉肝鬱（實），治肝氣鬱（實）（子瀉母），助安神，利排毒（清瀉肝氣鬱熱之毒）。\n• 提高兒童智力（4力震，為動，思維活動，又疏肝，強心健腦）。\n• 治脅肋痛（疏泄肝氣3可泄脅肋鬱滯之氣）。\n• 活血，通絡，化瘀（肝藏血，心主血脈，母生子，子瀉母）治踝扭傷等。"],[18,"震卦（4）配方詳解","4300",1,"震卦（4）單元方","• 清泄肝經，瀉肝鬱，治心火偏亢，頭疾偏陽者。提高兒童智力。\n• 溫通心陽而不過，疏肝降逆，下濟于腎陽。\n• 治腎實所致耳鳴，耳聾，頭脹，鼻塞，口苦，咽乾，脅痛等肝膽火盛症。\n• 滲濕，治溢淚（肝開竅于目）。\n• 疏氣通血脈，又可引火下行（00偏陰）"],[18,"震卦（4）配方詳解","0430",1,"震卦（4）單元方","• 以養血安神為重，前後0調和氣血寧神。\n• 調氣血，和陰陽（前後0）溫通局部。"],[18,"震卦（4）配方詳解","004300",1,"震卦（4）單元方","• 疏肝解鬱。"],[18,"震卦（4）配方詳解","4330",1,"震卦（4）單元方","• 治心臟病"],[18,"震卦（4）配方詳解","4380",1,"震卦（4）單元方","• 補肝血，溫補脾陽，濡養眼目，滋陰除煩。"],[18,"震卦（4）配方詳解","450",1,"震卦（4）單元方","• 溫心陽，疏心氣，驅寒邪（4為震，為劫，為心，安神5為奇數，為陽）。\n• 理氣，化痰，利水，·散瘀血（血得溫而化散）。\n• 治手指不能屈伸。\n• 助聽力（4為振，為雷，為聲，以復聽力；5為巽風，為鼓動聽力，雷風相搏）。（4．5均為木，45相互無補泄作用，那個數在前那個數作用大）。"],[18,"震卦（4）配方詳解","4500",1,"震卦（4）單元方","• 治眼疾（肝開竅于目5疏導局部）。"],[18,"巽卦（5）配方詳解","50",1,"巽卦（5）單元方","• 肋陽驅寒，溫心陽。\n• 振心氣。\n• 通脈絡，疏散風熱，解表發汗，損其有餘之熱邪，溫陽疏風（5為風，為進退，為散）。散寒，疏風，利膽，通肝膽，健胃，和胃。\n• 益肝疏導。\n• 振膽氣，排膽結石（木克艮土，碎7石）。\n• 疏肝氣（肝膽互為表裡），調暢氣以利濕。\n• 肋腎陽（肝腎同源）。\n• 助腎氣，溫陽，散寒，化濁。\n• 調氣散結（5主氣）。\n• 治全身痛（方50·380）風濕腿痛。\n• 振陽以溫腎，配合治腰痛及尿頻。\n• 治股痛（小腹，大腿，下肢）（5為股，為直，為長）。\n• 治手不能屈伸，左肩痛，風疹。\n• 善驅陰邪，振陽，疏通經絡，散寒，利關節（5為風，為陽，兼驅風散寒）。\n• 5偏陽，有損陰之趨，陰虛之體不宜用本方，用則易惡心。"],[18,"巽卦（5）配方詳解","500",1,"巽卦（5）單元方","• 治血壓低（膽中間空，可鼓起，形象使血壓增高）。\n• 5為陽數，化氣，主目（肝開竅于目），主鼻，主肺（巽為風，為出入，為喘息象），後加00偏陰，故可調氣，滋陰，宣肺，潤肺，利竅，通鼻，利咽，清火。\n• 主氣，育陰，升清化濁，通利氣管。\n• 發散，疏風，解表，散寒，清熱退燒（5為風，00偏陰涼）。\n• 治胸疾，膽疾（5為膽，為胸）。\n• 益陽，補氣，護陰，溫腎。\n• 治頸連及肩背痛（5巽為直，頸為直，以散寒除濕為主）。\n• 通陽，育陰，散結。\n• 潛陽，又助腎陽，溫通下焦，兼以散寒解表。\n• 滋陽潛陽，通利下肢。\n• 疏風，通絡，利下竅，治痔瘡（5為直，長，主腸道，也主下竅，又5為風，痔也稱肛風）。\n• 治眼乾（肝開竅于目，肝膽互為表裡，00偏陰，可濕潤眼目）。"],[18,"巽卦（5）配方詳解","5000",1,"巽卦（5）單元方","• 5巽木為陽，加000溫通效能更強，·5為膽，可和胃，降逆泄火。\n• 治頸椎病，落枕等強直強硬之疾（5巽為直，頸為直，5為風，000加強驅風之力）。\n• 5為股，為四肢，為神經，巽木可生離火，祛風除邪，治坐骨神經痛。\n• 5巽為木，苗，藤，叢生，長助植物生長。"],[18,"巽卦（5）配方詳解","500000",1,"巽卦（5）單元方","• 5為股，後加00000加強溫通能力。"],[18,"巽卦（5）配方詳解","050",1,"巽卦（5）單元方","• 5為風，祛陰邪，散寒，治小兒咳嗽歷害，嬰兒風寒感冒。\n• 滋陰調氣以清頭。\n• 養肝陰以除煩，·利膽，清頭，降壓。\n• 通陽，助氣而不燥（前後0）以通胸中氣血（5為喘息象，為胸），定心悸。\n• 振心氣兼以潤肺，通經逐邪（肺朝百脈）。\n• 溫通心陽，柔肝和胃。\n• 溫陽和胃。\n• 滋陰以降肝火，利膽和胃。\n• 消導積滯，利膽消食，治消化不良。\n• 柔肝，利膽，行氣（5為陽氣）化氣通絡，育陰（5前有0）。\n• 利膽而不燥，又疏肝養陰。\n• 滋陰潛陽，振奮腎氣。\n• 助腎陽。\n• 前後0養陰清熱。\n• 升陽和陰。\n• 5為木，具有生長條達，能屈能伸的特性，配合治肩周炎（5為左肩）。\n• 偏助氣，前0為陰，潛陽，後0為陽，利氣化散結。\n• 利膽，排石，散結，消瘤（木克艮土）。\n• 調腹中之氣以驅寒。\n• 5巽為細管以調輸卵管。\n• 散結，通便（5為風，風以散之），利膽，消導。\n• 幼兒通便（肝膽互為表裡，肝主疏泄，又5為長，大腸，有通便之意，前後0防助陽太過）。\n• 利肝膽，輔以明目。\n• 治眼乾（肝開竅于目，肝膽互為表裡）。\n• 宣肺，利鼻竅。\n• 治咽痛（風火相搏）。\n• 止癢（5為風，有止癢功能，前後0防巽燥）。\n• 治腮腺炎（方050·020·60 5為風，傳染之媒，5，2前後均加0行氣清熱）。"],[18,"巽卦（5）配方詳解","00500",1,"巽卦（5）單元方","• 5善助陽，益氣通絡，但其氣易上揚，前後00以助陰而降上逆之陽。\n• 通陽益氣，陰中存陽（5主肺，主氣）。\n• 利肝膽，前後00滋陰潛陽。\n• 湧陰，化氣，利膽（前後00養陰之中兼以化氣）。\n• 利肝膽（陽數又偏陰，為以陽統陰）。\n• 疏風，通利諸節，滋陰清熱以清頭，明目（肝開竅于目），調暢膽經。\n• 清頭降濁，化瘀而療痔瘡（00平調陰陽又助氣）；又巽為氣，以化氣通絡，巽為風，以疏風散寒，又肝腎同源，5善肋腎陽，其利膽和胃之功更直觀；又可潤燥通便，除煩定心。\n• 止癢（前後00防巽燥）。"],[18,"巽卦（5）配方詳解","0005000",1,"巽卦（5）單元方","• 5為巽，為風，為左頸肩，治強直強硬症，落枕等。"],[18,"巽卦（5）配方詳解","05",1,"巽卦（5）單元方","• 止癢（前0防巽燥）。"],[18,"巽卦（5）配方詳解","05000",1,"巽卦（5）單元方","• 5為陽數，可提氣，溫通之力強，前0防其燥。\n• 治坐骨神經痛（5為股，為神經）。"],[18,"巽卦（5）配方詳解","530",1,"巽卦（5）單元方","• 疏少陽瘀滯，5通三焦鬱滯，但木生火，偏溫熱，有助火之嫌，宜用在末元減弱其火力。"],[18,"巽卦（5）配方詳解","54000",1,"巽卦（5）單元方","• 治小腿及腳脖風濕，麻木，發涼（5為股，4為足，000加強溫熱去寒之效）。"],[18,"巽卦（5）配方詳解","005400",1,"巽卦（5）單元方","• 疏肝利膽。"],[18,"巽卦（5）配方詳解","5550",1,"巽卦（5）單元方","• 加強振歷陽氣，又木能生火，助心陽"],[18,"坎卦（6）配方詳解","60",1,"坎卦（6）單元方","• 滋陰，健腦，除煩（“腎藏精，精生髓，腦為髓之海”）。\n• 通絡，化瘀，健腦。\n• 通腎通利，降濁清頭。\n• 膀胱經通背肩頭，治肩背痛，偏頭痛。\n• 提高兒童智力。台60為主，配以健脾等數，此為從補腎入手，“腎主骨，生髓，通于腦：大腦發育不全和腦功能減退多責于腎。\n• 6交通心腎。\n• 治血脂高（6為腎，為水，為血液，可降低血液粘稠度）。\n• 6為足太陽膀胱經，“太陽為開，主一身之表”，故膀胱經有解表功能，可疏泄膀胱經，解一身表症之外感，如治感止咳嗽方：20·60   2000·60    200·60\n• 溫通腎陽。通腎氣，通經絡。\n• 助腎陽，腎氣，以溫通周身陽氣。\n• 固本扶正，通腎氣求本，振諸經之氣，為陰陽之源，·補腎氣，治一般腎虛，腎陽虛。\n• 腎主納氣，補先天濟後天，佐助脾运，可使肺氣歸根。\n• 補元氣（6主元氣）。\n• 通腎氣，調陰陽，通利諸經（腎為陰陽之根）。\n• 6比1溫，6陰氣最重，陽氣將復生，6後加0溫腎，鼓腎陽，化濁，既振陽氣，又滋陰。\n• 通腎陰，降內熱。\n• 滋陰通利。\n• 育陰，通絡，降濁（膀胱經從頭夾脊下行）。\n• 振腎氣，補血，助陰血，行氣血。\n• 通絡，活血（坎為血，為通）。\n• 6通腎氣，為潰瘍，為通，為利，60益腎，療潰，滲利。\n• 振奮肝膽疏泄之力，消炎利肝膽（水生木），治肝膽疾患。\n• 益腎，半骨，通絡，通利。\n• 治腰背痛（6為腰，通腎氣，主椎骨），含胸椎痛，突發性腰痛，腰椎增生，兒童腰痛。\n• 通絡，化瘀清熱，祛痛，如治鼻炎，治腳痛（腎為陰，為下，為足，腳底，腳後跟）。\n• 振腎氣，通鼻竅。\n• 益腎，通會陰，以通局部脈絡療痔瘡。\n• 養腎利水。\n• 滋水涵木（目），治眼疾（肝腎同源，肝開竅于目），花眼，眼角病等。\n• 振腎陽，調衝任，使血脈得固，治痛經（6為腎水，經血水，生殖器官屬腎，6直搗病竈，後加0偏溫，強其功能）。\n• 通經絡，善調小腹 。"],[18,"坎卦（6）配方詳解","600",1,"坎卦（6）單元方","• 通心腎，育陰潛陽（後00）。\n• 滋陰，涼血，除煩，安神益腎，調經。\n• 滋腎陰，清熱（00偏陰涼）。\n• 振腎氣，治寒濕腰痛（用于陰虛體，00防虛火上炎）。\n• 治血脂高（6為腎，為水，為血液，可降低血液粘稠度，用于陰虛體）。"],[18,"坎卦（6）配方詳解","6000",1,"坎卦（6）單元方","• 助腎氣，通氣血，益髓海。\n• 溫腎，濟心，散寒，·治血脂高。\n• 通腎固本。\n• 益腎固本。\n• 補腎氣，滋腎陰（氣陰雙補）。\n• 溫腎，通絡，通利，通陽，散寒。通利而降濁，溫通腎陽，行氣化濁，通脈和血\n• 6為腎，為水，為陰，為通，000強化腎氣，以利氣化，升清降濁，如治肺熱和便秘方：01·6000。\n• 6主膀胱。後加000強化貯尿排尿功能。\n• 治脫肛。\n• 止流血，摔傷出血，腎炎尿血。\n• 化氣行水，化濕利節。\n• 溫通局部，補腎氣，通絡，化瘀。\n• 通腎陽，主骨生髓。\n• 治頸椎增生。\n• 溫通腰府，治腎陽虛，腰痛，如外傷型腰痛，突發性腰痛，腰扭傷，腰骨摔傷，兒童腰痛。\n• 治腰痛，抵御離火（電焊所致腰痛）。\n• 治肺氣不宣所致水腫，腰痛。\n• 治附件炎（補益腎氣，溫通諸經，振奮陽氣，故帶脈固攝，任脈調通），閉經，去孕。\n• 振腎氣，正胎（方為6000，·10腎生髓，腦為髓海，故督脈與腎的功能有關。6000後加10又把胎兒的頭與母產道連接，10為頭。加10又可輔佐腎氣，6為下竅。為產道，又可放胎水使用權胎兒正常活動，6強腎氣使胎兒正常發育，6可疏通相關經絡，运化血氣，使胎兒吸收營養，1為乾健，正，亨通無阻）。"],[18,"坎卦（6）配方詳解","060",1,"坎卦（6）單元方","• 養陰，除煩，通絡。\n• 清熱養陰，潤肺滋腎。\n• 滋腎陰。\n• 通腎氣。\n• 調下腹諸，·通利咽喉（腎經沿喉嚨）。\n• 治摔傷出血。\n• 治兒童腰痛。"],[18,"坎卦（6）配方詳解","06000",1,"坎卦（6）單元方","• 補腎益精，又偏于固本升提（後000偏助陽，前0陽中有陰）。\n• 治泌尿系感梁（氣淋）。\n• 排尿管結石。"],[18,"坎卦（6）配方詳解","00600",1,"坎卦（6）單元方","• 強化滋陰通水。\n• 6為陰，為通，配合00200治魚刺卡喉。"],[18,"坎卦（6）配方詳解","0006000",1,"坎卦（6）單元方","• 溫陽化氣，通絡護陰，暖木散寒，調暢氣機。\n• 治腰椎增生型腰痛。\n• 6滋陰通竅。\n• 疏導膀胱經氣，驅除表邪。\n• 治中耳炎（腎開竅于耳）。\n• 6主水，前0為陰，水中加陰，治高燒（方06·04·07·01   06·04·08·02）。\n• 006·緩解吃辣椒辣嘴。"],[18,"坎卦（6）配方詳解","640",1,"坎卦（6）單元方","• 此方為滋陰潛陽的典型組合。又益腎補精。\n• 養陰安神。\n• 養陰血，安神定志。\n• 補陰血而安神。\n• 柔肝安神。\n• 益腎扶正，滋陰，防上炎，助心功能，除心煩。\n• 交通心腎（6為通，為血，4為震，為動，為心，為疏導，佐以養陰）。\n• 滋水涵木。\n• 4為震木，又疏土壅，防其克水，而助腎氣。\n• 降逆和胃。\n• 補腎通便（6腎為通，4震，為動，通滯）。\n• 疏導養陰（6，4皆養陰，4疏導）。\n• 益腎養肝。\n• 滋陰潛陽，補肝腎（肝腎同源），養肝血，治肝血不足，治脂防肝（6為脂肪，4疏泄肝）。\n• 補腎強肝，解毒利水，除陰寒，不僅增強止痛，還增強免疫功能，抵癌細胞繁衍。\n• 通腎利濕（4利濕，濕邪去腎氣以復）。\n• 治腎囊腫。\n• 肝腎同補，治筋弱無力，筋肉拘攣，屈伸不利，指甲薄軟（6通腎，4柔肝疏筋）。\n• 治半身不遂（4震，為手足）。\n• 以溫陽之力疏筋利節。\n• 調補肝腎，益血疏筋。\n• 清熱祛毒，疏泄肝經瘀滯，本方清熱消腫，為主元治臂足腫塊（4震，為手足）。\n• 滋補肝腎，滋水涵木（目），治兩眼乾澀，視物昏花（用于治陰虛者）。\n• 治溢淚。\n• 養血滋陰而柔肝，治近視。\n• 治口乾（6為水，4震，促出水）。\n• 腎為水，為血液，肝藏血，和順經血，治經血量少，閉經（本方肝腎同補，滋陰補血為主）。\n• 治乳腺病（乳頭為肝經所循）。\n• 6水濟萬物，水生木震巽，震為春，春生萬物。\n• 640一般用于陰虛者，650一般用于陰陽具虛者。"],[18,"坎卦（6）配方詳解","6400",1,"坎卦（6）單元方","• 養血，安神，潛陽（治肝鬱化火而失眠）。\n• 養陰清肺。\n• 偏陰，降虛火，4可疏筋利節。\n• 滋陰降火（00適于陰虛體）。\n• 滋肝陰，滋陰養血，補肝血，強腎使肝血充足。\n• 治易流淚。"],[18,"坎卦（6）配方詳解","64300",1,"坎卦（6）單元方","• 治肝腎陰虛而五心煩熱。\n• 滋陰養血。安神除煩。滋肝腎，濟心陰。"],[18,"坎卦（6）配方詳解","650",1,"坎卦（6）單元方","• 益腎助陽。\n• 溫陽（5為巽，可理氣散寒，配6水生木，防燥）。\n• 溫通陽氣。\n• 溫陽，化氣，通滯。\n• 鼓陽化疾，又和血行氣。\n• 善助陽助氣，以溫經，通絡，散寒（寒得溫則散）。\n• 益肝腎，髓海得養，除煩寧神。\n• 息風，治抽搐（方650·400）\n• 滋陰降逆，疏絡止痛，治頭通（用650若補之有過，可改用60·50）。\n• 助脾腎氣虛，頭暈可自除，心悸可自平。\n• 善治氣虛而致頭疾，心悸等。\n• 溫腎，通心陽。\n• 扶正以驅心中寒氣（6通陰陽）。\n• 通心腎，化濁濕。\n• 振奮腎陽，助心氣，治先天性心臟病，兒童心臟病（用本方治心疾，常優于直接補益心臟）。\n• 溫振腎陽。\n• 善補腎陽腎氣，其力較宏（6坎通腎，5奇數為陽，為風，善通周身）。\n• 溫腎陽，祛陰邪，化濁氣（5為氣，化氣，溫陽，通絡，助腎陽，降濁氣）。\n• 同補腎陰，腎陽，又疏泄，又補陰血，助肝陰，補肝腎。\n• 振腎氣，腎陽，腎陽通達諸經。\n• 溫腎益陽（溫煦命門）命門火衰易感止，本方防治感冒。\n• 滋陰，清熱，疏風，振奮氣機，通脈絡，解表發汗。\n• 振腎陽，以佐助脾运*前元有80），溫補先天以濟脾陽升化。\n• 強腎補氣，治胸疾（5主胸疾）。\n• 補腎利消化（5膽汗利消化，5又主胸疾）。\n• 振腎陽，溫大腸（5為下腹部，又為長，大腸），治腹瀉慢性腹瀉膽病口苦。\n• 振腎陽，治前列腺炎。\n• 治尿床（溫通腎陽，以利膀胱氣化，使膀胱水液代謝有序）。\n• 振腎陽，行氣活血，疏通經絡，祛寒濕。\n• 溫腎，散寒，通絡，溫經，溫中除濕。\n• 益腎壯骨，祛邪，通絡（6通腎固元，5化氣通滯）。\n• 促骨折愈合（壯腎強肝）。\n• 助腎陽，通利，主骨生髓生血。\n• 治坐骨神經痛。\n• 治左肩痛。\n• 治寒邪所致腰背酸痛，腰背痛。\n• 疏風通絡，·治腰膝疾患。\n• 治腳傷痛（腎水下陷滋注，5膽主疏泄）。\n• 治腎陽虛所致脫髮等。\n• 膽中空，有鼓起耒之意，如治肌肉萎縮方80·650·400。\n• 治眼疾，如眼乾澀，視物模糊，夜盲（用于陰陽具虛者）。\n• 溫腎陽以驅寒，溫通小腹（6為小腹）。\n• 治不孕症（宮冷不孕）。\n• 療婦科諸疾（6坎為腰，為腎，為小腹，5為陽數，化氣，散瘀，通絡）。\n• 650一般用于陰陽具虛者。640一般用于陰虛者。"],[18,"坎卦（6）配方詳解","6500",1,"坎卦（6）單元方","• 宣肺利咽。\n• 通陽益氣（6為通，5為氣）。\n• 滋肝腎（偶數0為陽中育陰，溫而不燥。）\n• 通絡祛邪。"],[18,"坎卦（6）配方詳解","65000",1,"坎卦（6）單元方","• 振腎陽，又用5去泄6，有疏泄作用。\n• 治動脈炎。\n• 治脖子外傷錯位。\n• 治腎陽虛水腫，腰膝酸軟。"],[18,"坎卦（6）配方詳解","660",1,"坎卦（6）單元方","• 涼血止血，治月經過多。"],[18,"坎卦（6）配方詳解","6660",1,"坎卦（6）單元方","• 強化腎氣而溫通，驅寒（多用于腎氣明顯虧虛者）。\n• 泄金生木（針對金克木之疾）。\n• 因6的通利，使肝氣得舒以和胃。\n• 強腎，治腰痛（6660比6000勁大）。\n• 治腎陽虛，如不育症（強化腎氣而溫通），尿不利，疝氣等"],[18,"艮卦（7）配方詳解","70",1,"艮卦（7）單元方","• 偏于提氣扶正，補後天之氣，振奮陽土，培土固元，扶正祛邪（7可振後天之氣以扶正，驅邪外出）。\n• 主中氣，以利升清降濁。\n• 治疑難病，頑症。\n• 治氣血不足。\n• 為氣虧氣虛者補氣（以後天養先天之氣）。\n• 益氣，通滯，降濁（胃主降），清頭。\n• 益中氣，佐助腎氣，生髓，養骨，益腦。\n• 治血壓低（7，山，高）。治實邪所致頭痛。益氣，止暈。\n• 提高兒童智力（頭為凸，頭主神志）。\n• 止兒童多動。\n• 化痰，滌濁 治風寒感冒（7為陽明胃經，此經夾鼻而上，用7為循經取數）。\n• 溫通胃腑，助納化，通陽明胃經，驅寒振胃氣，和胃，治胃腹之患，治胃虛寒（偏熱）。\n• 70為微濕性質，治胃陰不足有虛火所擾者（若用80，偏溫會惡心）。\n• 健脾，和胃，通胃，健胃，降濁。\n• 振奮胃氣而降濁。\n• 通便（7為滯，為陰，為梗）。\n• 通滯，化瘀，降濁。\n• 可疏通瘀陰（7為艮，為滯）。\n• 提氣，通陰，以療痔瘡。\n• 消堅散結，利排石（7為石，70促石活動，以利排出）。\n• 可疏角膽石，以消解或排出。化氣，壯骨，通絡。利骨節，祛濕，解肌，散寒。\n• 主中氣，升提，利运化。\n• 利關節，通諸節。\n• 治關節痛，背痛，髖部扭傷，坐骨神經痛，腳膝痛，足傷痛，足扭傷腫痛（關節，背，臀，足均為凸，以上傷痛左側療效更好，7為左腿）。\n• 通足，利足跟，通滯。\n• 治凸象病，如頭面部疾患（頭面為凸）。頭痛，頭面部腫痛，止牙痛特別是左牙痛。\n• 治鼻病（鼻為凸，側重于胃氣不足者），如寒氣所致鼻塞（7為堵，0為通），鼻炎，鼻腫痛。\n• 通鼻竅，通牙而通局部。\n• 通諸凸，通瘀滯，固齒。\n• 治近視（象在山上看得遠）。\n• 可散乳中增生，通乳中之絡（足陽明經經過乳房）。\n• 70偏涼，念時間長了會感到涼，可改念70·80（80偏溫）。"],[18,"艮卦（7）配方詳解","700",1,"艮卦（7）單元方","• 治脾胃疾，偏去熱，治胃中虛熱，偏于益陰，屬陽中育陰。\n• 助中氣，通竅（艮為鼻）。治鼻病，側重于胃氣不足者（2也治鼻病，側重于肺氣虛者）。"],[18,"艮卦（7）配方詳解","7000",1,"艮卦（7）單元方","• 7為止，後加000強化止的作用，為大止，止痛，止突發肚痛，止癌痛（又7為凸，為腫瘤）。\n• 止血（又7健脾統血，有土克水止血水之意），止流水，止尿床，還有念此方止雨淋者。\n• 提氣，和胃。\n• 助氣，行血，療口瘡。\n• 治脫肛（脫肛為正氣不足）。\n• 通滯，利節。\n• 升清降濁，氣行血行，利關節。\n• 提氣，祛風寒，通經，化滯，散瘀。\n• 溫通氣血，溫陽化濕，治背及混身痛，脅扭傷，左側坐骨神經痛，臀腿痛，膝關節痛，膝關節冷痛，踝扭傷，足關節病（中腫脹瘀多用4000），足萎軟乏力，足骨折等。\n• 壯骨（足骨折）。\n• 補中益氣，壯骨。\n• 溫中，驅寒，·壯骨。\n• 壯骨，通諸節，以利頸椎。\n• 本方驅邪力大，若患者病多年正氣有損，用000有過，易有不良反應。"],[18,"艮卦（7）配方詳解","070",1,"艮卦（7）單元方","• 補益中氣，使氣血生化有源（前後0調陰陽，又偏益氣）。\n• 補中提氣。\n• 補中氣，排濁（前後0養陰清熱）。\n• 補胃氣，兼以養陰。\n• 和胃，養陰，通經，降逆。\n• 艮為積食，070共振疏解積滯。\n• 和胃補氣，化瘀（艮為阻，前後0護陰不滯）。\n• 養陰清胃，升清降濁。\n• 養胃陰，治胃虛，平胃氣，止酸水，泄胃火，治口腔潰爛及爛嘴角。\n• 壯骨通絡，利骨節。\n• 通滯化氣。\n• 散通瘀滯（7為滯）。\n• 7為鼻，為肩背，前後0以調和氣血，散結通滯。\n• 7為止，疏通局部氣機（前後0不燥不膩，陰陽平衡），緩痛，治腰通（又腰為艮凸象）止結石痛（又7為艮石）。\n• 治面部之患，治牙痛尤其左牙痛。\n• 固齒清濁。\n• 通乳腺增長率生，子宮肌瘤（7為艮，為凸，為瘤）。"],[18,"艮卦（7）配方詳解","07",1,"艮卦（7）單元方","• 可振後天之氣以扶正，驅熱邪外出，止高燒（治高燒方：06·04·07·01）。\n• 治鼻病，側重于胃氣不足者，治熱邪所致鼻塞，治鼻炎。\n• 止暈，止吐。"],[18,"艮卦（7）配方詳解","007",1,"艮卦（7）單元方","• 治胃中實熱，面部疾患，牙痛尤其左牙痛。"],[18,"艮卦（7）配方詳解","0070",1,"艮卦（7）單元方","• 治關節炎（風濕熱痺）。\n• 治帶狀皰疹（7為凸，為疹，為止，前00偏涼降溫。）"],[18,"艮卦（7）配方詳解","00700",1,"艮卦（7）單元方","• 和胃養陰，治胃陰不足燒心。\n• 滋胃陰，降胃火，治胃中實熱。\n• 通經絡，前後同數0可調和陰陽，偏于滋陰，適宜于陰虛陽盛者。\n• 利關節，治關節痛，局部症狀明顯者（偏陰通經）。\n• 治左腿疾患（7為左腿，前後00通局部，又不傷陰，病人體虛者。00防火上炎）。\n• 清熱消腫，治踝扭傷（7為凸，為關節，踝又為足陽明經經過之處）。"],[18,"艮卦（7）配方詳解","0007000",1,"艮卦（7）單元方","• 止痛祛風，前後000加強其功效，強通局部，前後同數0可調節器和陰陽，偏陽。\n• 通經活絡，助陽，適用于陽虛陰盛者。\n• 治關節炎（風寒濕痺，局部症狀明顯者）雙腿痛，膝關節傷痛發作，左足腫痛等。"],[18,"艮卦（7）配方詳解","710",1,"艮卦（7）單元方","• 1為乾金，為陽，為督脈，7為土，土生金，使督脈氣更盛，督脈搏主一身之陽，督脈通，全身陽脈皆通。\n• 振陽剛之氣，治陽萎。\n• 0007165000 ·治頸椎增生伴腎炎腰痛，浮腫。"],[18,"艮卦（7）配方詳解","720",1,"艮卦（7）單元方","• 補中氣，助氣（7為後天之氣，2為肺氣）以調節全身氣機，疏解氣機，提氣扶正。\n• 具有強有力的溫胃。通血，透氣，活心功能（7振脾溫胃，並利宣泄，促血液循環，2為氣，加快肺與心臟氣體交換，使心肌血液含氧增加，以而加強心功能）。\n• 增氧，增強心功能。\n• 溫脾和胃，溫通心陽（後天陽氣振奮，心陽自通）。止心悸，降逆安神。\n• 助肺氣，治肺氣虛咳嗽，止咳（7為堵，720泄堵）。\n• 治胃滿（子泄母）。\n• 7振脾陽，除痰濁，善驅陰濕之邪，又祛痰（脾與胃互為表裡，脾為生痰之源）。\n• 720偏于補肺氣不足，820偏于健脾化痰排濁（肺虛寒則痰盛）。\n• 消導積滯（艮為滯20瀉積滯）。\n• 升提，降濁。\n• 利于活血，散熱，排毒，行氣，活血，散瘀，疏導經絡，強化臟腑。\n• 偏于益氣，氣行血行。\n• 扶正祛邪（7陽土振後天之氣），通條水道（2肺主肅降）。\n• 疏導氣機，止腎炎尿血。\n• 止小兒尿床（補氣）。\n• 溫通局部，消腫塊，消腫消炎（7為凸，為腫，2為皮膚，土生金加強皮膚護衛功能，又子泄母消腫消炎）。\n• 疏鬆結石（7為石，2子泄母），利排石後調通水道。\n• 提氣，壯骨，利關節（尤利左腿）。\n• 治關節痛（7為關節，2主疏泄）。\n• 治背痛（7為凸，為背，2振奮氣機，子泄母之瘀）。\n• 治坐骨神經痛（7為凸，為臀，止痛，2助7疏泄局部）。\n• 治靜脈炎（7為多節樹木，如血脈網絡，2主氣，氣通血則通，720振脈道）。\n• 治鼻炎等鼻病（7胃經夾鼻上行，2為肺，鼻為肺之竅。"],[18,"艮卦（7）配方詳解","0720",1,"艮卦（7）單元方","• 補肺氣，助肺宣發，治鼻炎（前後0不寒不熱，陰陽平衡）。"],[18,"艮卦（7）配方詳解","7260",1,"艮卦（7）單元方","• 宣肺益氣（7。2均生助腎氣）。\n• 益腎通絡。"],[18,"艮卦（7）配方詳解","7770",1,"艮卦（7）單元方","• 有補鈣功能（7為骨，為硬）。\n• 治摔傷出血（7770比7000力度大）。"],[18,"艮卦（7）配方詳解","780",1,"艮卦（7）單元方","• 溫脾止瀉（7，8均為土，78相互無補泄作用，那個數在前那個數作用大）。"],[18,"艮卦（7）配方詳解","7800",1,"艮卦（7）單元方","• 健脾助疏泄。\n• 止痛（7為止，8為肌肉）。"],[18,"艮卦（7）配方詳解","78000",1,"艮卦（7）單元方","• 治胃脹不適。"],[18,"坤卦（8）配方詳解","80",1,"坤卦（8）單元方","• 坤有祛腫滿及軟化作用，80治腦血栓，頭部瘤，頭右側痛（軟化腦血管，8為右）。\n• 溫脾益氣，振脾佐以補肺氣，治氣血不足（坤土為血生化之源），乏力。\n• 健脾，益氣。固本。\n• 散寒，化濁，助腎陽。\n• 健脾，燥濕。\n• 補後天之氣，偏于健脾，散寒，除濕。解肌。振脾氣，溫補脾腎之陽，健脾可升清降濁。\n• 健脾益氣，促水液代謝，化痰，振奮肺氣。\n• 可通鼻。\n• 脾與胃互為表裡，80溫振奮脾胃，又坤為腹，調腹部氣機，故80治胃腹之患，如胃寒，胃寒濕，胃寒邪嚴重（80偏溫，可滲濕驅寒，若用70或07會惡心）。\n• 溫中健脾，和肌膚，療潰陽，消腹脹。\n• 治右肩痛（8為右肩）四肢痛（脾主四肢）。\n• 治口腔潰爛（脾開竅于口，80健脾生肌滲濕止痛）。\n• 治雞眼。\n• 80配以其它方可促病愈。"],[18,"坤卦（8）配方詳解","800",1,"坤卦（8）單元方","• 溫中，散寒，通絡，兼護陰，·治虛熱血症。\n• 除煩，潤腸（8為腹，00滋陰）。\n• 运化水濕，祛痰，·治痔瘡（8主肌肉，為瘡，脾攝血，消腫，去毒）。\n• 治口腔病（脾開竅于口。00偏陰，清熱消炎）。"],[18,"坤卦（8）配方詳解","8000",1,"坤卦（8）單元方","• 溫中，益氣，散寒。\n• 治唇磕破（脾開竅于口）。"],[18,"坤卦（8）配方詳解","08",1,"坤卦（8）單元方","• 偏陰，為靜，為緩，以靜制陽，治高燒（方：06·04·08·02）。\n• 运化水濕，祛痰。\n• 治痔瘡（8主肌肉，為瘡，脾攝血，消腫，去毒）。\n• 治口腔病（脾開竅于口，00偏陰，清熱消炎）。"],[18,"坤卦（8）配方詳解","080",1,"坤卦（8）單元方","• 溫經，健脾，解肌（脾主機肉）以散乳中之瘀。\n• 健脾，化濁，護陰。\n• 溫中，散寒，通絡，護陰。\n• 健中，升提，療痔瘡，祛濕濁。"],[18,"坤卦（8）配方詳解","0008000",1,"坤卦（8）單元方","• 治誤吞金屬物（8為胃腸）。"],[18,"坤卦（8）配方詳解","810",1,"坤卦（8）單元方","• 可通鼻。"],[18,"坤卦（8）配方詳解","820",1,"坤卦（8）單元方","• 健脾益氣，補中氣（脾土得以溫煦而中氣足），有增氧補氣作用，治氣虛，肺氣不足，呼吸無力。\n• 健脾运化（820貌似泄脾，但肺主一身之氣）。\n• 健脾益氣，生化氣血，可固後天之本。\n• 溫中，化氣。\n• 通任脈，和氣血（8為任脈）。\n• 健脾益氣，升清降濁（8溫脾祛濕緩急，2益肺調氣）。\n• 補肺氣不足（多用于肺寒痰盛）。\n• 泄脾濕，振脾陽，助肺氣，利肅降。\n• 健脾化痰排濁，治肺虛寒痰盛（720偏于補肺氣不足）。\n• 治肺結核（脾喜燥惡濕，促水液代謝，健脾益氣化痰，振奮肺氣，2宣導氣機，疏散肺中瘀滯，8代表濁物）。\n• 治肺癌咳血（土生金，加強肺的生長能量）。\n• 健脾，益氣，化痰，統血。\n• 健脾益氣，升清降濁，脾氣有升，胃氣得降。\n• 暖腹化瘀（8散腹中之寒，2理腹中之氣而通絡），又助脾氣以驅寒。\n• 健脾运化，祛腹中瘀積，降濁。\n• 除腹中濁物（8為終，為舊，為濁物）。\n• 治腸患，除腹脹，調節腹中鬱滯，調通二便，排毒，治腸粘連（為腹中痰濁之邪）。\n• 治痔瘡（子泄母，消腫，去瘡毒，8為瘡，2為氣，為肛）。\n• 治右側肢體傷痛，如右肋痛，右肩背痛，右肩周炎，右側肢體摔傷，右側頸脅肋摔傷等（820為子泄母之瘀事及寒凝）。\n• 治四肢癱瘓（脾主四肢，健脾提氣）。\n• 治口腔潰爛（8主肌肉，脾開竅于口，2為皮膚，為口，主氣，相互為用）適用于氣虧，脾虛濕困，體弱者。\n• 有美容作用，可使皮膚變白（2為皮膚，金為白色，念2口角有笑意）。"],[18,"坤卦（8）配方詳解","8200",1,"坤卦（8）單元方","• 健脾燥濕，又生肌，治胃潰瘍（後加00防火上炎）。"],[18,"坤卦（8）配方詳解","82000",1,"坤卦（8）單元方","• 健脾理肺氣。\n• 健脾益氣，氣通血通，治氣血虛。\n• 溫經益氣通絡（8散寒，主肌肉，可振肌肉，生肌。2000調氣通絡活血，側重右側）。"],[18,"坤卦（8）配方詳解","870",1,"坤卦（8）單元方","• 溫脾止瀉。"],[18,"坤卦（8）配方詳解","880",1,"坤卦（8）單元方","• 治胃寒溫脾更力，但虛寒之象不十分明顯著，不易常念此方，以防上炎。"],[18,"坤卦（8）配方詳解","008800",1,"坤卦（8）單元方","• 助脾統血。"],[18,"坤卦（8）配方詳解","8880",1,"坤卦（8）單元方","• 對寒氣，陰氣重者輸入陽氣。"]];

 });return frag;

  if(d[5].length>70||d[5].includes("\n")){const x=document.createElement("details"),s=document.createElement("summary"),p=document.createElement("p");
   s.textContent="功能說明";p.textContent=d[5];x.append(s,p);c.appendChild(x)}
  else{const n=document.createElement("div");n.className="note";n.textContent="備註："+d[5];c.appendChild(n)}
 }
 return c;
}
function run(){
 q=$("q").value.trim().toLowerCase();limit=40;drawChips();
 const toks=q?q.split(/\s+/):[];
 res=[];
 for(let i=0;i<DATA.length;i++){
  const d=DATA[i];
  if(cat>=0&&d[0]!==cat)continue;if(ver>=0&&d[3]!==ver)continue;
  if(toks.every(t=>H[i].includes(t)))res.push(d);
 }
 draw();
}
function draw(){
 const L=$("list");L.textContent="";
 if(!q&&cat<0&&ver<0){
  $("info").textContent="";
  const e=document.createElement("div");e.className="empty";e.textContent="輸入症狀開始搜尋，或點選上方分類瀏覽。";
  const k=document.createElement("div");k.className="quick";
  ["失眠","感冒","頭痛","胃痛","便秘","高血壓","咳嗽","腰痛"].forEach(w=>chip(k,w,false,()=>{$("q").value=w;run()}));
  e.appendChild(k);L.appendChild(e);return;
 }
 $("info").textContent=res.length?"找到 "+res.length+" 筆"+(q?"（多個關鍵字請用空格分開，需同時符合）":""):"";
 if(!res.length){const e=document.createElement("div");e.className="empty";e.textContent="找不到相符資料，請改用較短的關鍵字（例如“頭痛”改搜“頭”），或改用繁體字。";L.appendChild(e);return}
 res.slice(0,limit).forEach(d=>L.appendChild(card(d)));
 if(res.length>limit){const b=document.createElement("button");b.className="more";b.textContent="顯示更多（還有 "+(res.length-limit)+" 筆）";b.onclick=()=>{limit+=40;draw()};L.appendChild(b)}
}
let tm;$("q").addEventListener("input",()=>{clearTimeout(tm);tm=setTimeout(run,150)});
const GUIDE=[["基本唸法",[["讀法","0～8 的數字照一般讀音逐字唸，例如 3810 唸“三八一零”，不要唸成“三千八百一十”。"],["節奏","中速，約一秒一個數；配方中的“·”只表示停頓約一秒、不用唸出；整組唸完停約兩秒，再重複。"],["方式","默唸即可，不拘時間、地點、姿勢；行走坐臥皆可。唸時只專心於數字，不要想著患處。"],["先試唸","先試唸幾分鐘到幾十分鐘。若頭部、心區、胃部出現不適（如心悸、氣短、胸悶、頭脹、胃不舒服），文件建議立即停止並換方；其他部位的不適或舊痛重現，文件稱為“氣沖病灶”反應，可視情況繼續。"],["持唸時間","版本1：一次約 40 分鐘以上為宜，每天三次（晨醒後、睡前唸至入睡、夜醒後），其餘時間想到就唸，一般累計 2～3 小時，重症更長。版本2：一般人每天累計不少於 2 小時，症狀明顯者另外安排集中時間。"],["同症多組","同一症狀有 ①②③ 多組時，可依序試唸，感覺舒適者續用；有不適就換下一組。"],["病癒之後","文件說明可續唸原配方以鞏固並保健。"],["代唸","小孩不會默唸，可由大人代唸；特殊情況可由他人握住患者的手輔助。"]]],["注意事項",[["同時多人","兩人以上同時唸各自不同的配方，文件建議相隔兩公尺以上。"],["其他器具","文件建議唸誦期間不同時使用保健器具、磁療器材或其他氣功功法。"],["不適用者","文件註明：精神不正常，或記憶力差、總是唸錯唸顛倒者，不宜使用。"],["關於停藥","版本2 提到唸誦期間可逐步停藥，本頁不建議這樣做：正在服藥者請勿自行減藥或停藥，一律遵醫囑。"],["就醫提醒","文件所述療效（如有效率、治癒率）未經獨立醫學驗證。急重症、症狀持續或惡化，請立即就醫；本方法最多作為輔助。"]]],["資料說明",[["來源","版本1《象數療法完整版》、版本2《八卦象數配方及應用（完整版）》（依八卦說明各單元方功能）、版本3《八卦象數病例常用配方匯總（一）》。"],["整理","簡體字已轉繁體；數字分隔統一為“·”，多組配方以 ①②③ 編號；原文錯字未更動。個別條目可能有切分誤差，請對照原文。"]]]];
function showTab(n){$("t1").setAttribute("aria-pressed",n===1);$("t2").setAttribute("aria-pressed",n===2);$("sbox").hidden=n!==1;$("pg1").hidden=n!==1;$("pg2").hidden=n!==2;window.scrollTo(0,0)}
function buildPg2(){
 const P=$("pg2");
 const h=document.createElement("h2");h.className="sec";h.textContent="分類目錄（點選即查看）";P.appendChild(h);
 SHEETS.forEach((s,i)=>{
  const rows=DATA.filter(d=>d[0]===i);let subs=[];
  [2,0,1].forEach(v=>{if(!subs.length)rows.forEach(d=>{if(d[3]===v&&d[4]&&!subs.includes(d[4]))subs.push(d[4])})});
  if(!subs.length)subs=rows.slice(0,6).map(d=>d[1]);
  const b=document.createElement("button");b.className="dir";b.type="button";
  const n=document.createElement("b");n.textContent=s;const c=document.createElement("span");c.textContent=rows.length+" 筆";
  const p=document.createElement("p");p.textContent=s==="配方詳解"?"乾、兌、離、震、巽、坎、艮、坤八卦各單元方的功能與主治說明":subs.slice(0,7).join("、")+(subs.length>7?"…":"");
  b.append(n,c,p);b.onclick=()=>{$("q").value="";cat=i;ver=-1;showTab(1);run()};P.appendChild(b);
 });
 GUIDE.forEach(g=>{
  const t=document.createElement("h2");t.className="sec";t.textContent=g[0];P.appendChild(t);
  g[1].forEach(x=>{const d=document.createElement("div");d.className="it";const k=document.createElement("b");k.textContent=x[0];d.append(k,document.createTextNode(x[1]));P.appendChild(d)});
 });
}
$("t1").onclick=()=>showTab(1);$("t2").onclick=()=>showTab(2);
buildPg2();
run();
</script></body></html>
